name: Regression suite

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements-ci.txt

      - name: Validate dashboard runtime lock resolves
        run: >-
          python -m pip install --dry-run
          --requirement triagewall/dashboard/requirements.txt

      - name: Run unit and security regressions
        run: >-
          python -m unittest
          tests.test_asset_inventory
          tests.test_database
          tests.test_db_startup
          tests.test_dashboard_stats
          tests.test_ingest_checkpoint
          tests.test_prefilter
          tests.test_retention
          tests.test_retention_cycle
          tests.test_runtime_dependencies
          tests.test_security_regressions
          tests.test_timestamps
          tests.test_wazuh_ingest

      - name: Run SPC regressions
        run: PYTHONPATH=. python tests/test_spc.py

      - name: Run dashboard polling regressions
        run: node --test tests/test_dashboard_polling.js

      - name: Compile Python sources
        run: python -m compileall -q triagewall tests scripts

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.wazuh.yml --profile wazuh config --quiet

      - name: Build Docker services
        run: docker compose -f docker-compose.yml -f docker-compose.wazuh.yml --profile wazuh build
