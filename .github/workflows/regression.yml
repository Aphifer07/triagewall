name: Regression suite

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --requirement tests/requirements-ci.txt

      - name: Run unit and security regressions
        run: >-
          python -m unittest
          tests.test_database
          tests.test_db_startup
          tests.test_dashboard_stats
          tests.test_ingest_checkpoint
          tests.test_security_regressions

      - name: Run SPC regressions
        run: PYTHONPATH=. python tests/test_spc.py

      - name: Run dashboard polling regressions
        run: node --test tests/test_dashboard_polling.js

      - name: Compile Python sources
        run: python -m compileall -q triagewall tests scripts

      - name: Validate Docker Compose
        run: docker compose config --quiet
