services:
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    command:
      - python3
      - triagewall/ingest.py
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DB_PATH: ${DB_PATH:-/var/lib/triagewall/triage.db}
      EVE_PATH: ${EVE_PATH:-/var/log/suricata/eve.json}
      POSITION_PATH: ${POSITION_PATH:-/var/lib/triagewall/position.json}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}

      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/gabriellarson/Foundation-Sec-8B-Instruct-GGUF:Q5_K_M}

      DEMO_MODE: ${DEMO_MODE:-false}
      INTERNAL_SUBNETS: ${INTERNAL_SUBNETS:-10.0.0.0/24 and 192.168.1.0/24}
      ASSET_INVENTORY_PATH: /app/triagewall/config/assets.json
    volumes:
      - ${HOST_DATA_DIR:-./data}:/var/lib/triagewall
      - ${HOST_EVE_DIR:-./data}:/var/log/suricata:ro
      - ./triagewall/config/prefilter.json:/app/triagewall/config/prefilter.json:ro
      - ${HOST_ASSET_INVENTORY:-./triagewall/config/assets.example.json}:/app/triagewall/config/assets.json:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command:
      - uvicorn
      - triagewall.dashboard.app:app
      - --host
      - ${DASHBOARD_HOST:-0.0.0.0}
      - --port
      - ${DASHBOARD_PORT:-8084}
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DB_PATH: ${DB_PATH:-/var/lib/triagewall/triage.db}
      MODE: ${MODE:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8084}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/var/lib/triagewall
    ports:
      - "${DASHBOARD_PORT:-8084}:${DASHBOARD_PORT:-8084}"
    depends_on:
      - ingest
    restart: unless-stopped

  maintenance:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile.ingest
    entrypoint:
      - python3
      - triagewall/retention.py
    command:
      - status
    environment:
      TZ: ${TZ:-UTC}
      DB_PATH: ${DB_PATH:-/var/lib/triagewall/triage.db}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/var/lib/triagewall
      - ${HOST_BACKUP_DIR:-./backups}:/var/backups/triagewall
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
