services:
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      TRIAGE_DB: /var/lib/triagewall/triage.db
      TZ: UTC

      EVE_PATH: /var/log/suricata/eve.json
      POSITION_PATH: /var/lib/triagewall/position.json
      # On Linux, you may need to replace host.docker.internal with your host IP (e.g. http://192.168.1.10:11434)
      OLLAMA_HOST: http://10.0.0.170:11434
      DEMO_MODE: "true"
    volumes:
      - triage_data:/var/lib/triagewall
      # Production: mount your Suricata eve.json into the container, e.g.:
      # - /var/log/suricata/eve.json:/var/log/suricata/eve.json:ro
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      TRIAGE_DB: /var/lib/triagewall/triage.db
      TZ: UTC
    volumes:
      - triage_data:/var/lib/triagewall
    ports:
      - "8084:8084"
    depends_on:
      - ingest
    restart: unless-stopped

volumes:
  triage_data:
